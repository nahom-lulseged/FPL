services:
  # Web API Service
  - type: web
    name: fpl-api
    env: node
    rootDir: fpl-backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: REDIS_URL
        sync: false

  # Background Worker Service
  - type: worker
    name: fpl-worker
    env: node
    rootDir: fpl-backend
    buildCommand: npm install
    startCommand: npm run worker
    plan: free
    envVars:
      - key: REDIS_URL
        sync: false